<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Career Path Finder</title>
		<link
			rel="icon"
			type="image/png"
			href="images/RainbowSproutsLogo.png"
		/>
		<link rel="stylesheet" href="css/common.css" />
		<link rel="stylesheet" href="css/index.css" />
	</head>
	<body>
		<div class="container">
			<div id="nav-mount"></div>
			<div class="content-wrapper">
				<main class="hero">
					<h1>Career Path Finder</h1>
					<p class="subtitle">
						Discover careers aligned with your interests &
						personality
					</p>

					<div class="search-box">
						<input
							id="dreamInput"
							type="text"
							placeholder="Search your dream!!!"
						/>
						<button id="startBtn">Search</button>
					</div>

					<p class="intro">
						Welcome to Rainbow Sprouts, a Career Path Finder and Advisor. This
						is a project created for the Step Up Loudoun competition
						by middle-schoolers. We spent lots of time and effort on
						this project, so keep that in mind.
					</p>
				</main>
			</div>
			<div id="footer-mount"></div>
		</div>
		<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
		<script src="js/firebase-config.local.js"></script>
		<script src="js/firebase-config.js"></script>
		<script src="js/common.js"></script>
		<script>
			const btn = document.getElementById("startBtn");
			const input = document.getElementById("dreamInput");

			btn.onclick = () => {
				if (!window.firebaseAuth || !window.firebaseAuth.currentUser) {
					window.location.href = "login.html";
					return;
				}

				const value = input.value.trim();
				if (!value) return alert("Please enter your dream career!");
				// Clear only quiz-related data; preserve auth (user) for nav/firebase fallback
				localStorage.removeItem("dreamCareer");
				localStorage.removeItem("quizResult");
				localStorage.setItem("dreamCareer", value);
				window.location.href = "dashboard.html";
			};

			input.addEventListener("keydown", (e) => {
				if (e.key === "Enter") btn.click();
			});
		</script>
	</body>
</html>
