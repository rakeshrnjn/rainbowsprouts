<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainbow Sprouts - Quiz</title>
    <link rel="icon" type="image/png" href="images/RainbowSproutsLogo.png" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/quiz.css" />
</head>
<body>
    <div class="container">
        <header id="nav-mount"></header>
        <div class="content-wrapper">
            <section class="main-content">
                <div class="hero">
                    <div class="hero-text">
                        <h1 class="outlined-title">Career Path Finder</h1>
                        <p class="subtitle">Discover careers aligned with your interests & personality</p>
                    </div>
                </div>
                <div class="quiz-box">
                    <div class="brand-header">
                        <img src="images/RainbowSproutsLogo.png" alt="Rainbow Sprouts" class="logo-img">
                    </div>
                    <div id="mode">
                        <h1 style="text-align: center;">Career Path Finder Quiz</h1>
						<button class="btn-mode basic" onclick="start('basic')">Basic Analysis (15 Questions)</button>
                        <button class="btn-mode advanced" onclick="start('advanced')">Advanced Analysis (30 Questions)</button>
                    </div>
                    <div class="progress-section" id="prog-area" style="display:none;">
                        <p id="counter"></p>
                        <div class="progress-track">
                            <div id="bar"></div>
                        </div>
                    </div>
                    <div id="quiz" style="display:none;">
                        <div id="q"></div>
                        <div class="btn-container">
                            <button class="continue-btn" onclick="nextQ()">Continue &rarr;</button>
                        </div>
                    </div>
                    <div id="results" style="display:none;">
                        <h2 class="res-title">Your Career Matches</h2>
                        <div id="out"></div>
                        <div class="res-footer">
                            <button class="btn-mode basic" onclick="resetApp()">⬅ Back to Home</button>
                            <p class="salary-source">Salary data: U.S. Bureau of Labor Statistics (OOH)</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <div id="footer-mount"></div>
    </div>
    <script src="js/common.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
